<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" role="img" aria-labelledby="t d">
<title id="t">Ilustrasi boot priasolOS</title><desc id="d">Terminal QEMU animasi: log inisialisasi kernel muncul satu per satu, lalu perintah hello dan clock diketik di shell.</desc>
<defs>
  <clipPath id="win"><rect width="880" height="380" rx="12"/></clipPath>
  <clipPath id="c1"><rect x="149.8" y="269" height="20" width="0"><animate attributeName="width" values="0;8.7;17.4;26.1;34.8;43.5;0" keyTimes="0;0.5563;0.565;0.5737;0.5825;0.5913;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c2"><rect x="149.8" y="313" height="20" width="0"><animate attributeName="width" values="0;8.7;17.4;26.1;34.8;43.5;52.2;60.9;0" keyTimes="0;0.7188;0.7275;0.7362;0.745;0.7538;0.7625;0.7712;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<g clip-path="url(#win)">
  <rect width="880" height="380" fill="#070b18"/>
  <rect width="880" height="34" fill="#121a3a"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/><circle cx="42" cy="17" r="6" fill="#ffbd2e"/><circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="440.0" y="22" font-size="13" text-anchor="middle" fill="#8ea0d6">qemu-system-i386 — priasolOS</text>
  <text x="28" y="64" font-size="14.5" fill="#7f86b8" opacity="0" textLength="321.9" lengthAdjust="spacing" xml:space="preserve">GRUB Legacy: loading /boot/kernel ...<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0375;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="28" y="86" font-size="14.5" fill="#e6ecff" opacity="0" textLength="321.9" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7dffb5">[ OK ]</tspan> Global Descriptor Table loaded<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0844;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="28" y="108" font-size="14.5" fill="#e6ecff" opacity="0" textLength="313.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7dffb5">[ OK ]</tspan> PIC remapped, IDT initialized<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1313;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="28" y="130" font-size="14.5" fill="#e6ecff" opacity="0" textLength="261.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7dffb5">[ OK ]</tspan> Keyboard IRQ1 activated<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1781;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="28" y="152" font-size="14.5" fill="#e6ecff" opacity="0" textLength="226.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7dffb5">[ OK ]</tspan> Framebuffer cleared<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.225;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="28" y="174" font-size="14.5" fill="#e6ecff" opacity="0" textLength="426.3" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7dffb5">[ OK ]</tspan> EXT2 ready, swap 4 MiB (storage.bin 8 MiB)<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2719;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="28" y="196" font-size="14.5" fill="#e6ecff" opacity="0" textLength="321.9" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7dffb5">[ OK ]</tspan> TSS installed, user mode ready<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3187;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="28" y="218" font-size="14.5" fill="#e6ecff" opacity="0" textLength="330.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7dffb5">[ OK ]</tspan> Paging on, kernel at 0xC0000000<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3656;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="28" y="240" font-size="14.5" fill="#e6ecff" opacity="0" textLength="348.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7dffb5">[ OK ]</tspan> Process &#x27;shell&#x27; created from EXT2<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4125;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="28" y="262" font-size="14.5" fill="#e6ecff" opacity="0" textLength="382.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7dffb5">[ OK ]</tspan> Scheduler started, timer interrupt on<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4594;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="28" y="284" font-size="14.5" fill="#a9d8ff" opacity="0" textLength="121.8" lengthAdjust="spacing" xml:space="preserve">priasolOS@/ $ <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5125;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="149.8" y="284" font-size="14.5" fill="#ffd98a" clip-path="url(#c1)" textLength="43.5" lengthAdjust="spacing">hello</text><text x="28" y="306" font-size="14.5" fill="#ffffff" opacity="0" textLength="104.4" lengthAdjust="spacing">Hello World!<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6312;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="28" y="328" font-size="14.5" fill="#a9d8ff" opacity="0" textLength="121.8" lengthAdjust="spacing" xml:space="preserve">priasolOS@/ $ <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6813;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/></text><text x="149.8" y="328" font-size="14.5" fill="#ffd98a" clip-path="url(#c2)" textLength="60.9" lengthAdjust="spacing">clock &amp;</text>
  <rect y="350" width="880" height="30" fill="#02040a"/>
  <text x="28" y="370" font-size="12.5" fill="#7f86b8">priasolOS  |  128 MB RAM  |  disk 8 MiB (EXT2 + swap)  |  proses user: shell</text>
  <g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7937;0.95" calcMode="discrete" dur="16s" repeatCount="indefinite"/><text x="782.4" y="370" font-size="14.5" fill="#ffd98a" textLength="60.9" lengthAdjust="spacing">20:52:4</text><text x="843.3" y="370" font-size="14.5" fill="#ffd98a" opacity="0">0<animate attributeName="opacity" values="1;0" keyTimes="0;0.1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="843.3" y="370" font-size="14.5" fill="#ffd98a" opacity="0">1<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;0.2" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="843.3" y="370" font-size="14.5" fill="#ffd98a" opacity="0">2<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.3" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="843.3" y="370" font-size="14.5" fill="#ffd98a" opacity="0">3<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;0.4" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="843.3" y="370" font-size="14.5" fill="#ffd98a" opacity="0">4<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;0.5" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="843.3" y="370" font-size="14.5" fill="#ffd98a" opacity="0">5<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.6" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="843.3" y="370" font-size="14.5" fill="#ffd98a" opacity="0">6<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;0.7" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="843.3" y="370" font-size="14.5" fill="#ffd98a" opacity="0">7<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="843.3" y="370" font-size="14.5" fill="#ffd98a" opacity="0">8<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8;0.9" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text><text x="843.3" y="370" font-size="14.5" fill="#ffd98a" opacity="0">9<animate attributeName="opacity" values="0;1" keyTimes="0;0.9" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text></g>
  <rect width="880" height="2" fill="#fff" opacity=".05"><animate attributeName="y" values="34;380" dur="6s" repeatCount="indefinite"/></rect>
</g>
<rect x=".75" y=".75" width="878.5" height="378.5" rx="11.5" fill="none" stroke="#2a3560" stroke-width="1.5"/>
