<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" role="img" aria-labelledby="t d">
<title id="t">Ilustrasi round-robin scheduler</title><desc id="d">Animasi tiga proses (shell, clock, hello) bergiliran berstatus RUNNING setiap timer interrupt, seperti scheduler priasolOS.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140d2e"/><stop offset="1" stop-color="#3b2c86"/></linearGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9b8ff"/></marker>
  <clipPath id="frame"><rect width="880" height="310" rx="16"/></clipPath>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#frame)">
  <rect width="880" height="310" fill="url(#bg)"/>
  <text x="28" y="38" font-size="15" font-weight="700" fill="#f3eeff">ROUND-ROBIN SCHEDULER</text>
  <text x="28" y="58" font-size="12" fill="#a59ad6">ilustrasi: tiap timer interrupt, giliran CPU pindah ke proses READY berikutnya</text>
  <!-- timer -->
  <g transform="translate(796 40)">
    <circle r="15" fill="#0f1530" stroke="#ff9ad5" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#ff9ad5" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/></line>
    <circle r="2" fill="#ff9ad5"/>
    <text x="0" y="34" font-size="10.5" text-anchor="middle" fill="#ff9ad5">timer</text>
  </g>
  <g>
  <rect x="120" y="104" width="160" height="90" rx="12" fill="#0f1530" stroke="#2a3560" stroke-width="2">
    <animate attributeName="stroke" values="#ffd98a;#2a3560" keyTimes="0;0.3333" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#0f2a2a;#0f1530" keyTimes="0;0.3333" calcMode="discrete" dur="6s" repeatCount="indefinite"/></rect>
  <text x="200.0" y="154" font-size="22" font-weight="700" text-anchor="middle" fill="#f3eeff">shell</text>
  <text x="200.0" y="176" font-size="11" text-anchor="middle" fill="#a59ad6">user process</text>
  <text x="200.0" y="222" font-size="14" font-weight="700" text-anchor="middle" fill="#ffd98a" opacity="0">RUNNING
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
  <text x="200.0" y="222" font-size="14" text-anchor="middle" fill="#a59ad6" opacity="1">READY
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.3333" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
  <polygon points="190.0,82 210.0,82 200.0,96" fill="#ffd98a" opacity="0">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="6s" repeatCount="indefinite"/></polygon>
</g><g>
  <rect x="360" y="104" width="160" height="90" rx="12" fill="#0f1530" stroke="#2a3560" stroke-width="2">
    <animate attributeName="stroke" values="#2a3560;#ffd98a;#2a3560" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#0f1530;#0f2a2a;#0f1530" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></rect>
  <text x="440.0" y="154" font-size="22" font-weight="700" text-anchor="middle" fill="#f3eeff">clock</text>
  <text x="440.0" y="176" font-size="11" text-anchor="middle" fill="#a59ad6">user process</text>
  <text x="440.0" y="222" font-size="14" font-weight="700" text-anchor="middle" fill="#ffd98a" opacity="0">RUNNING
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
  <text x="440.0" y="222" font-size="14" text-anchor="middle" fill="#a59ad6" opacity="1">READY
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
  <polygon points="430.0,82 450.0,82 440.0,96" fill="#ffd98a" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></polygon>
</g><g>
  <rect x="600" y="104" width="160" height="90" rx="12" fill="#0f1530" stroke="#2a3560" stroke-width="2">
    <animate attributeName="stroke" values="#2a3560;#ffd98a" keyTimes="0;0.6667" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#0f1530;#0f2a2a" keyTimes="0;0.6667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></rect>
  <text x="680.0" y="154" font-size="22" font-weight="700" text-anchor="middle" fill="#f3eeff">hello</text>
  <text x="680.0" y="176" font-size="11" text-anchor="middle" fill="#a59ad6">user process</text>
  <text x="680.0" y="222" font-size="14" font-weight="700" text-anchor="middle" fill="#ffd98a" opacity="0">RUNNING
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.6667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
  <text x="680.0" y="222" font-size="14" text-anchor="middle" fill="#a59ad6" opacity="1">READY
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.6667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
  <polygon points="670.0,82 690.0,82 680.0,96" fill="#ffd98a" opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.6667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></polygon>
</g>
  <g opacity=".25"><animate attributeName="opacity" values="0.25;1;0.25" keyTimes="0;0.3333;1" dur="6s" repeatCount="indefinite"/><line x1="284" y1="149" x2="354" y2="149" stroke="#c9b8ff" stroke-width="2.5" marker-end="url(#ah)"/><text x="319.0" y="174" font-size="10.5" text-anchor="middle" fill="#c9b8ff">switch</text></g><g opacity=".25"><animate attributeName="opacity" values="0.25;1;0.25" keyTimes="0;0.6667;1" dur="6s" repeatCount="indefinite"/><line x1="524" y1="149" x2="594" y2="149" stroke="#c9b8ff" stroke-width="2.5" marker-end="url(#ah)"/><text x="559.0" y="174" font-size="10.5" text-anchor="middle" fill="#c9b8ff">switch</text></g>
  <g opacity=".25"><animate attributeName="opacity" values="1;0.25;0.25;1" keyTimes="0;.06;.94;1" dur="6s" repeatCount="indefinite"/><path d="M680 238 V272 H200 V244" fill="none" stroke="#c9b8ff" stroke-width="2.5" marker-end="url(#ah)"/><text x="440" y="266" font-size="10.5" text-anchor="middle" fill="#c9b8ff">kembali ke antrean</text></g>
  <text x="856" y="296" font-size="11" text-anchor="end" fill="#a59ad6">scheduler.c · scheduler_switch_to_next_process()</text>
</g>
<rect x="1" y="1" width="878" height="308" rx="15" fill="none" stroke="#2f4aa0" stroke-opacity=".7" stroke-width="2"/>
</svg>
